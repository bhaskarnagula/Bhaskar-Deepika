    /* Subtle Parchment Paper Texture & Ambient Styling */
    body {
      background-color: #FAF5EC;

        radial-gradient(circle at 85% 85%, rgba(223, 192, 122, 0.18) 0%, transparent 45%),

      color: #2E261E;
      overflow-x: hidden;

    /* Gold Foil Shimmer Text */
    .gold-gradient-text {
      background: linear-gradient(135deg, #8F6722 0%, #C9A050 45%, #8F6722 75%, #B08435 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-size: 200% auto;
      animation: shimmer 7s linear infinite;
    }

    @keyframes shimmer {
      0% { background-position: 0% center; }
      100% { background-position: 200% center; }
    }

    /* Arch Card Double Border Frame matching the Invitation Card */
    .arch-frame-outer {
      border: 1.5px solid #C9A050;
      border-radius: 240px 240px 24px 24px;
      position: relative;
    }
    .arch-frame-inner {
      border: 1px solid rgba(201, 160, 80, 0.65);
      border-radius: 232px 232px 18px 18px;
    }

    @media (max-width: 640px) {
      .arch-frame-outer {
        border-radius: 170px 170px 20px 20px;
      }
      .arch-frame-inner {
        border-radius: 164px 164px 14px 14px;
      }
    }

    /* Smooth Scroll Reveal Transitions */
    .reveal {
      opacity: 0;
      transform: translateY(24px);
      transition: opacity 0.85s cubic-bezier(0.22, 1, 0.36, 1), transform 0.85s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Floating Gold Petals / Dust Particles */
    .particle {
      position: fixed;
      pointer-events: none;
      z-index: 1;
      border-radius: 50%;
      opacity: 0;
      animation: floatUp linear infinite;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(105vh) rotate(0deg) scale(0.7);
        opacity: 0;
      }
      15% {
        opacity: 0.55;
      }
      85% {
        opacity: 0.45;
      }
      100% {
        transform: translateY(-10vh) rotate(360deg) scale(1.1);
        opacity: 0;
      }
    }

    /* Gentle Sway for Corner Florals */
    .floral-sway-top {
      transform-origin: top left;
      animation: gentleSway 8s ease-in-out infinite alternate;
    }
    .floral-sway-bottom {
      transform-origin: bottom right;
      animation: gentleSway 9s ease-in-out infinite alternate-reverse;
    }

    @keyframes gentleSway {
      0% { transform: rotate(0deg) scale(1); }
      100% { transform: rotate(1.5deg) scale(1.015); }
    }
  </style>
